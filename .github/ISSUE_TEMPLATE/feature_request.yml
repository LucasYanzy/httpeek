name: Feature request
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个需求来自什么痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的方案
      description: 期望的用法示例（命令行/集合格式）。
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该方案不引入第三方依赖（httpeek 坚持零依赖）
          required: true
